<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneaker Hub</title>
    <style>
      html {
        background-color: #fff7f3;
        color-scheme: light;
      }
      html.dark {
        background-color: #000000;
        color-scheme: dark;
      }
      body {
        margin: 0;
      }
      .boot-loading {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #fff7f3;
        color: #2d2430;
        font:
          14px system-ui,
          sans-serif;
      }
      html.dark .boot-loading {
        background-color: #000000;
        color: #f7f2ee;
      }
      .boot-loading-video {
        display: block;
        width: clamp(160px, 15vw, 220px);
        height: auto;
        object-fit: contain;
        background: transparent;
      }
    </style>

    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Nếu không đọc được localStorage thì giữ giao diện sáng.
      }
    </script>
  </head>

  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-label="Đang tải Sneaker Hub">
        <video
          class="boot-loading-video"
          src="/videos/shoe-loading.webm"
          autoplay
          muted
          loop
          playsinline
          aria-hidden="true"
        ></video>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
